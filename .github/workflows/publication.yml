# Mise en ligne (fiche 0003) : publie l'appli sur GitHub Pages à chaque fusion sur main,
# seulement si les tests passent. Adresse : https://jeanbaptiste-roseausi.github.io/jours-a-vendre/
name: Publication

on:
  push:
    branches: [main]

# Aucune permission par défaut, chaque job demande seulement ce dont il a besoin.
permissions: {}

# Une seule publication à la fois, sans interrompre celle en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploiement:
    needs: construction
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
