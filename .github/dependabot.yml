# Mises à jour hebdomadaires (fiche 0003). Les correctifs de sécurité, eux, arrivent dès leur publication.
# Chaque mise à jour passe par une demande de fusion et l'intégration continue, comme le reste.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "Dépendances"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "Actions"
